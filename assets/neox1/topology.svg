<title id="title">NEO-X1 Pro AI lab PCIe topology</title><desc id="desc">Four GPUs share a Gen4 x16 uplink through a Broadcom PEX88096. A ZOTAC RTX 5070 Twin Edge OC sits on an AOOSTAR AG03 dock with an integrated 800 W PSU, connected to the host by one OCuLink cable at Gen4 x4.</desc>
