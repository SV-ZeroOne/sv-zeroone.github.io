<canvas id="zabout" aria-hidden="true"></canvas>
<style>
#zabout{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;display:block;background:#151515}
</style>
<script>
(function(){
  var cv = document.getElementById('zabout'); if (!cv || cv.dataset.on) return; cv.dataset.on = 1;
  var ctx = cv.getContext('2d'), reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W = 0, H = 0, DPR = 1, raf = 0, bg, traces = [], cat = null;
  var LIME = '181,232,83';
  function rng(s){ var a = s >>> 0; return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function rr(c, x, y, w, h, rad){ rad = Math.min(rad, w / 2, h / 2); c.beginPath(); c.moveTo(x + rad, y); c.arcTo(x + w, y, x + w, y + h, rad); c.arcTo(x + w, y + h, x, y + h, rad); c.arcTo(x, y + h, x, y, rad); c.arcTo(x, y, x + w, y, rad); c.closePath(); }

  function fatCat(c, cx, cy, s){
    var lw = Math.max(1.4, s * .022), line = 'rgba(' + LIME + ',.32)', face = 'rgba(10,14,10,.45)', visor = '#0a0d10';
    c.lineJoin = 'round'; c.lineCap = 'round';
    // tail
    c.strokeStyle = 'rgba(' + LIME + ',.22)'; c.lineWidth = lw * 1.3; c.beginPath(); c.moveTo(cx + s * .72, cy + s * .75); c.bezierCurveTo(cx + s * 1.4, cy + s * .6, cx + s * 1.5, cy - s * .15, cx + s * 1.02, cy - s * .35); c.stroke();
    c.strokeStyle = line; c.lineWidth = lw; c.fillStyle = face;
    // body (fat)
    c.beginPath(); c.ellipse(cx, cy + s * .4, s * .88, s * .78, 0, 0, 7); c.fill(); c.stroke();
    // front paws
    c.beginPath(); c.ellipse(cx - s * .36, cy + s * 1.02, s * .24, s * .17, 0, 0, 7); c.fill(); c.stroke();
    c.beginPath(); c.ellipse(cx + s * .36, cy + s * 1.02, s * .24, s * .17, 0, 0, 7); c.fill(); c.stroke();
    c.beginPath(); c.moveTo(cx - s * .36, cy + s * 1.1); c.lineTo(cx - s * .36, cy + s * .95); c.moveTo(cx + s * .36, cy + s * 1.1); c.lineTo(cx + s * .36, cy + s * .95); c.stroke(); // toe lines
    // head
    c.beginPath(); c.ellipse(cx, cy - s * .5, s * .64, s * .56, 0, 0, 7); c.fill(); c.stroke();
    // ears
    c.beginPath(); c.moveTo(cx - s * .5, cy - s * .8); c.lineTo(cx - s * .64, cy - s * 1.28); c.lineTo(cx - s * .16, cy - s * .95); c.closePath(); c.fill(); c.stroke();
    c.beginPath(); c.moveTo(cx + s * .5, cy - s * .8); c.lineTo(cx + s * .64, cy - s * 1.28); c.lineTo(cx + s * .16, cy - s * .95); c.closePath(); c.fill(); c.stroke();
    // antenna on the head
    var ty = cy - s * 1.0 - s * .35; c.beginPath(); c.moveTo(cx, cy - s * 1.0); c.lineTo(cx, ty); c.stroke();
    // visor
    rr(c, cx - s * .5, cy - s * .62, s * 1.0, s * .34, s * .12); c.fillStyle = visor; c.fill(); c.strokeStyle = line; c.lineWidth = lw * .9; c.stroke();
    // whiskers
    c.strokeStyle = 'rgba(' + LIME + ',.22)'; c.lineWidth = lw * .7;
    for (var sg = -1; sg <= 1; sg += 2) for (var k = 0; k < 3; k++) { c.beginPath(); c.moveTo(cx + sg * s * .2, cy - s * .32 + k * s * .12); c.lineTo(cx + sg * s * .95, cy - s * .4 + k * s * .16); c.stroke(); }
    // chest circuit trace
    c.strokeStyle = 'rgba(' + LIME + ',.2)'; c.lineWidth = lw * .7; c.beginPath(); c.moveTo(cx, cy + s * .1); c.lineTo(cx, cy + s * .5); c.lineTo(cx + s * .3, cy + s * .5); c.stroke();
    return { cx: cx, cy: cy, s: s, eyeY: cy - s * .45, antTip: { x: cx, y: ty } };
  }

  function build(){
    bg = document.createElement('canvas'); bg.width = W * DPR; bg.height = H * DPR;
    var c = bg.getContext('2d'); c.setTransform(DPR, 0, 0, DPR, 0, 0);
    var g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#151515'); g.addColorStop(1, '#11140f'); c.fillStyle = g; c.fillRect(0, 0, W, H);
    var r = rng(19), grid = Math.max(26, Math.min(W, H) / 22);
    traces = [];
    // circuit traces: right-angle walks on a grid, with pads at the ends
    var n = Math.round(W * H / 42000);
    for (var i = 0; i < n; i++) {
      var x = Math.round(r() * W / grid) * grid, y = Math.round(r() * H / grid) * grid, pts = [[x, y]], horiz = r() < .5, segs = 2 + (r() * 4 | 0);
      for (var sgi = 0; sgi < segs; sgi++) { var len = (1 + (r() * 3 | 0)) * grid * (r() < .5 ? 1 : -1); if (horiz) x += len; else y += len; x = Math.max(0, Math.min(W, x)); y = Math.max(0, Math.min(H, y)); pts.push([x, y]); horiz = !horiz; }
      c.strokeStyle = 'rgba(' + LIME + ',.12)'; c.lineWidth = 1; c.beginPath(); c.moveTo(pts[0][0], pts[0][1]); for (var p = 1; p < pts.length; p++) c.lineTo(pts[p][0], pts[p][1]); c.stroke();
      c.fillStyle = 'rgba(' + LIME + ',.18)'; c.fillRect(pts[0][0] - 2, pts[0][1] - 2, 4, 4); var e = pts[pts.length - 1]; c.beginPath(); c.arc(e[0], e[1], 2.5, 0, 7); c.fill();
      if (r() < .5) traces.push({ pts: pts, ph: r() });
    }
    // a couple of IC chips
    for (var j = 0; j < 3; j++) { var cxp = r() * W * .8 + W * .1, cyp = r() * H * .8 + H * .1, cw = grid * 1.6, chh = grid; c.strokeStyle = 'rgba(' + LIME + ',.14)'; c.strokeRect(cxp, cyp, cw, chh); for (var pin = 0; pin < 5; pin++) { c.beginPath(); c.moveTo(cxp + 4 + pin * (cw - 8) / 4, cyp); c.lineTo(cxp + 4 + pin * (cw - 8) / 4, cyp - 5); c.moveTo(cxp + 4 + pin * (cw - 8) / 4, cyp + chh); c.lineTo(cxp + 4 + pin * (cw - 8) / 4, cyp + chh + 5); c.stroke(); } }
    // the fat cat
    var s = Math.min(W, H) * .15, cx = W > 760 ? W * .8 : W * .5, cy = H > 520 ? H * .64 : H * .6;
    cat = fatCat(c, cx, cy, s);
  }

  function frame(now){
    raf = 0; var t = now / 1000;
    ctx.clearRect(0, 0, W, H); ctx.drawImage(bg, 0, 0, W, H);
    // pulses travelling along traces
    for (var i = 0; i < traces.length; i++) {
      var tr = traces[i], pts = tr.pts, total = pts.length - 1, prog = ((t * .25 + tr.ph) % 1) * total, seg = Math.floor(prog), f = prog - seg;
      if (seg < total) { var a = pts[seg], b = pts[seg + 1], px = a[0] + (b[0] - a[0]) * f, py = a[1] + (b[1] - a[1]) * f; ctx.fillStyle = 'rgba(' + LIME + ',.9)'; ctx.shadowColor = 'rgba(' + LIME + ',.8)'; ctx.shadowBlur = 6; ctx.fillRect(px - 1.5, py - 1.5, 3, 3); ctx.shadowBlur = 0; }
    }
    if (cat) {
      // eye glow
      var pr = .55 + .45 * Math.sin(t * 2), blink = (Math.sin(t * .7) > .995) ? .1 : 1;
      for (var e = -1; e <= 1; e += 2) { var ex = cat.cx + e * cat.s * .27; ctx.fillStyle = 'rgba(' + LIME + ',' + (pr * blink * .9) + ')'; ctx.shadowColor = 'rgba(' + LIME + ',.8)'; ctx.shadowBlur = 10 * pr; ctx.beginPath(); ctx.ellipse(ex, cat.eyeY, cat.s * .1, cat.s * .085, 0, 0, 7); ctx.fill(); ctx.shadowBlur = 0; }
      // antenna broadcasting rings
      var at = cat.antTip; ctx.fillStyle = 'rgba(' + LIME + ',.8)'; ctx.fillRect(at.x - 1.5, at.y - 1.5, 3, 3);
      for (var k = 0; k < 3; k++) { var p = ((t * .35 + k / 3) % 1); ctx.strokeStyle = 'rgba(' + LIME + ',' + ((1 - p) * .3) + ')'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(at.x, at.y, 4 + p * 70, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke(); }
    }
    if (!reduced) raf = requestAnimationFrame(frame);
  }
  function stop(){ if (raf) { cancelAnimationFrame(raf); raf = 0; } }
  function start(){ if (reduced || raf) return; raf = requestAnimationFrame(frame); }
  function resize(){ stop(); DPR = Math.min(2, window.devicePixelRatio || 1); W = window.innerWidth; H = window.innerHeight; cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0); build(); frame(performance.now()); }
  window.addEventListener('resize', resize); resize();
  document.addEventListener('visibilitychange', function(){ document.hidden ? stop() : start(); });
})();
</script>
