title: Zero Security
description: Hacking and Penetration Testing Stuff
url: https://sv-zeroone.github.io
repository_url: https://github.com/SV-ZeroOne/sv-zeroone.github.io
lang: en-GB
timezone: Europe/London
author: zero
show_downloads: false

# GA4 measurement ID (G-XXXXXXXXXX). Only emitted in production builds.
google_analytics: G-3BRCD00GQ2
# Cloudflare Web Analytics beacon token (cookie-free). Only emitted in production builds.
cloudflare_analytics: f7960309d3304367bad72dc35b8b6c16

twitter:
  card: summary_large_image

plugins:
  - jekyll-seo-tag
  - jekyll-titles-from-headings
  - jekyll-feed
  - jekyll-sitemap
  - jemoji

# CTF/lab writeups live in _writeups/ and keep their original /writeups/<file>.html URLs.
collections:
  writeups:
    output: true
    permalink: /writeups/:path:output_ext
    sort_by: order

# Writeups have no title: front matter; take it from the first heading.
titles_from_headings:
  collections: true

defaults:
  - scope:
      type: posts
    values:
      layout: post
  - scope:
      type: writeups
    values:
      layout: default
  - scope:
      path: ""
    values:
      image: /assets/og-default.png

exclude:
  - README.md
  - CLAUDE.md
  - LICENSE
