<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset='utf-8'>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">

{% seo %}
{% feed_meta %}
{% include google-analytics.html %}
  </head>

  <body>

    <header>
      <div class="container">
        <a id="a-title" href="{{ '/' | relative_url }}">
          <h1>{{ site.title }}</h1>
        </a>
        <h2>{{ site.description }}</h2>

        <section id="downloads">
          {% if site.show_downloads %}
            <a href="{{ site.repository_url }}/zipball/master" class="btn">Download as .zip</a>
            <a href="{{ site.repository_url }}/tarball/master" class="btn">Download as .tar.gz</a>
          {% endif %}
          <a href="{{'/writeups/main-writeups.html' | relative_url}}" class="btn">Hacking Write-ups</a>
          <a href="{{'/blog/main-blog.html' | relative_url }}" class="btn">Blog Posts</a>
          <a href="{{ site.repository_url }}" class="btn btn-github"><span class="icon"></span>View on GitHub</a>
        </section>
      </div>
    </header>

    <div class="container">
      <section id="main_content">
        {{ content }}
      </section>
    </div>

    {% include footer.html %}
  </body>
</html>
